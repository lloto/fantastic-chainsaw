<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For you 💌</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #f0f4f8, #e9edf2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Times New Roman", "Microsoft Yahei", serif;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            max-width: 560px;
            width: 100%;
            padding: 45px 35px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(70,90,120,0.12);
            text-align: center;
        }
        .heart {
            font-size: 48px;
            color: #5a789c;
            animation: beat 1.4s infinite;
            margin-bottom: 22px;
        }
        @keyframes beat {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            color: #3a4a5c;
            font-size: 17px;
            line-height: 1.85;
            margin-bottom: 16px;
        }
        .signature {
            margin-top: 35px;
            font-style: italic;
            color: #607894;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart">♡</div>
        <h1>To my dearest</h1>
        <p>谢谢你的陪伴</p >
        <p>不用勉强自己时刻保持耀眼，累的时候可以停下来，我会一直在这里</p >
        <p>隔着距离的想念，每一份都很认真</p >
        <p>慢慢来，你说你想给爱你的人和你爱的人好的生活，相信你，加油哦</p >
        <p class="signature">— Your 佳慧</p >
    </div>
</body>
</html>
